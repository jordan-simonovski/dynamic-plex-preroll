# "Collections Worth Checking Out": lists the movie collections on the server
# with their title counts. Uses the plex.collections provider, which surfaces a
# collection's child count as Views. Run with: MANIFEST_PATH=manifests/collections.yaml
name: collections
resolution: 1920x1080
fps: 24
output: output/collections.mp4
length: 18

audio:
  file: media/common/vano-adult-swim.mp3
  mode: soundtrack
  fadeOut: { start: 13, duration: 5 }

data:
  collections:
    provider: plex.collections
    params: { section: "{{ .MovieSectionId }}", sort: "titleSort", limit: "8" }

layouts:
  collections:
    background: { color: "#0c1018" }
    font: media/common/Adult-Swim-Font.ttf
    elements:
      - { type: text, x: 96, y: 170, size: 88, color: white, text: "Collections Worth Checking Out" }
      - type: list
        x: 96
        startY: 340
        stepY: 92
        size: 50
        color: "#cdd6e0"
        source: collections
        item: '{{ .Rank }}.  {{ truncate 38 .Name }}   ({{ .Views }} {{ pluralize .Views "title" "titles" }})'

scenes:
  - kind: render
    layout: collections
    duration: 18
    # Dimmed grid of collection posters behind the list.
    background: { source: collections, mode: poster, tile: grid, dim: 0.4 }
